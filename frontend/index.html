<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SchemaSense AI — Natural Language. Precise SQL.</title>
    <meta
      name="description"
      content="SchemaSense AI: Engineering-grade natural-language-to-SQL studio with schema intelligence and verified architecture."
    />
    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- FOUC Prevention Script: Defaults to dark if no preference stored -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('schemasense_theme') || 'dark';
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
            document.querySelector('meta[name="color-scheme"]').content = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="color-scheme"]').content = 'dark';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-surface text-foreground font-sans antialiased selection:bg-indigo-500/25 selection:text-indigo-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
